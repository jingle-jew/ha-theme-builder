name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ha-theme-builder-hacs.zip
            dist/ha-theme-builder.zip
